<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Leap Sandbox</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            z-index: 10;
        }

        #hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .energy-dot {
            width: 12px;
            height: 12px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            transition: opacity 0.2s, transform 0.2s;
        }

        .energy-dot.depleted {
            opacity: 0.2;
            box-shadow: none;
            transform: scale(0.8);
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div id="instructions">
        <h1>Gravity Leap Sandbox</h1>
        <p>W, A, S, D - Move</p>
        <p>Mouse / Arrows - Look</p>
        <p>Shift + Space + W/A/S/D - Gravity Leap (Costs Life Force)</p>
        <p>Click to start</p>
    </div>

    <div id="hud">
        <!-- Energy dots will be generated here -->
    </div>
    <script type="module">
        import * as THREE from 'three';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x202020);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Player position will be managed manually

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // --- Environment (Voxel Room) ---
        const roomSize = 20;
        const boxGeometry = new THREE.BoxGeometry(roomSize, roomSize, roomSize);
        const boxMaterial = new THREE.MeshPhongMaterial({
            color: 0x808080,
            side: THREE.BackSide, // Inside of the box
        });
        const room = new THREE.Mesh(boxGeometry, boxMaterial);
        scene.add(room);

        // Add some "voxels" inside for reference
        for (let i = 0; i < 50; i++) {
            const size = Math.random() * 2 + 0.5;
            const geom = new THREE.BoxGeometry(size, size, size);
            const mat = new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff });
            const voxel = new THREE.Mesh(geom, mat);
            voxel.position.set(
                (Math.random() - 0.5) * (roomSize - 2),
                (Math.random() - 0.5) * (roomSize - 2),
                (Math.random() - 0.5) * (roomSize - 2)
            );
            scene.add(voxel);
        }

        // --- Player State ---
        const player = {
            position: new THREE.Vector3(0, -roomSize / 2 + 0.5, 0),
            velocity: new THREE.Vector3(),
            // bodyQuaternion represents the orientation of the "floor"
            bodyQuaternion: new THREE.Quaternion(),
            // lookRotation represents yaw (y) and pitch (x) relative to bodyQuaternion
            lookRotation: new THREE.Euler(0, 0, 0, 'YXZ'),
            height: 1.6,
            isGrounded: false,
            isLeaping: false,
            leapTargetQuaternion: new THREE.Quaternion(),
            leapStartQuaternion: new THREE.Quaternion(),
            leapStartTime: 0,
            leapDuration: 0.6,
            energy: 100,
            maxEnergy: 100,
        };

        // --- Input Handling ---
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            checkGravityLeapTrigger(e.code);
        });

        function checkGravityLeapTrigger(newlyPressedCode) {
            // Must have Shift, Space, and one of W/A/S/D held
            if (keys['ShiftLeft'] || keys['ShiftRight']) {
                if (keys['Space']) {
                    const directionKeys = ['KeyW', 'KeyA', 'KeyS', 'KeyD'];

                    // If the newly pressed key is a direction key, trigger leap
                    if (directionKeys.includes(newlyPressedCode)) {
                        handleGravityLeap(newlyPressedCode);
                        return;
                    }

                    // If the newly pressed key was Space or Shift, check if a direction is already held
                    if (newlyPressedCode === 'Space' || newlyPressedCode.startsWith('Shift')) {
                        for (const k of directionKeys) {
                            if (keys[k]) {
                                handleGravityLeap(k);
                                break;
                            }
                        }
                    }
                }
            }
        }
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        const leapEnergyCost = 25;
        const energyRegenRate = 15;

        function handleGravityLeap(code) {
            if (player.energy < leapEnergyCost) return;

            let rotationAxis = null;
            let angle = 0;

            if (code === 'KeyW') {
                // Pitch forward 90 degrees
                rotationAxis = new THREE.Vector3(1, 0, 0);
                angle = Math.PI / 2;
            } else if (code === 'KeyS') {
                // Flip backward 180 degrees
                rotationAxis = new THREE.Vector3(1, 0, 0);
                angle = Math.PI;
            } else if (code === 'KeyA') {
                // Roll left 90 degrees -> Left wall becomes floor
                rotationAxis = new THREE.Vector3(0, 0, 1);
                angle = -Math.PI / 2;
            } else if (code === 'KeyD') {
                // Roll right 90 degrees -> Right wall becomes floor
                rotationAxis = new THREE.Vector3(0, 0, 1);
                angle = Math.PI / 2;
            }

            if (rotationAxis && !player.isLeaping) {
                player.energy -= leapEnergyCost;
                initiateLeap(rotationAxis, angle);
            }
        }

        function initiateLeap(axis, angle) {
            player.isLeaping = true;
            player.leapStartTime = performance.now();

            // 1. Get current yaw rotation and snap it to the nearest 90-degree increment for "block world"
            const snappedYaw = Math.round(player.lookRotation.y / (Math.PI / 2)) * (Math.PI / 2);
            const yawQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), snappedYaw);

            // 2. orientedBodyQuaternion is the cardinal direction the player is "aiming" their leap
            const orientedBodyQuaternion = new THREE.Quaternion().copy(player.bodyQuaternion).multiply(yawQuaternion);

            // We slerp FROM the current look basis (not snapped) for visual smoothness
            const currentYawQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), player.lookRotation.y);
            player.leapStartQuaternion.copy(player.bodyQuaternion).multiply(currentYawQuaternion);

            // 3. Apply the leap rotation (pitch/roll) relative to the SNAPPED oriented basis
            const leapRotation = new THREE.Quaternion().setFromAxisAngle(axis, angle);
            player.leapTargetQuaternion.copy(orientedBodyQuaternion).multiply(leapRotation).normalize();

            // Apply leap forces
            const upVector = new THREE.Vector3(0, 1, 0).applyQuaternion(player.bodyQuaternion);
            const forwardVector = new THREE.Vector3(0, 0, -1).applyQuaternion(orientedBodyQuaternion);

            player.velocity.addScaledVector(upVector, 8); // Jump up
            player.velocity.addScaledVector(forwardVector, 5); // Leap forward

            player.isGrounded = false;

            // Update body quaternion instantly for physics
            player.bodyQuaternion.copy(player.leapTargetQuaternion);

            // Reset yaw relative to the new floor, accounting for the difference between snapped and current yaw
            player.lookRotation.y = player.lookRotation.y - snappedYaw;
        }

        // Current visual orientation of the player's body (for smoothing)
        let visualBodyQuaternion = new THREE.Quaternion();

        const instructions = document.getElementById('instructions');
        const mouseSensitivity = 0.002;

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                player.lookRotation.y -= e.movementX * mouseSensitivity;
                player.lookRotation.x -= e.movementY * mouseSensitivity;

                // Clamp pitch
                player.lookRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.lookRotation.x));
            }
        });

        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                instructions.style.display = 'none';
            } else {
                instructions.style.display = 'block';
            }
        });

        const moveSpeed = 5;
        const gravityForce = 20;
        const arrowLookSpeed = 2.0;

        // --- HUD Implementation ---
        const hud = document.getElementById('hud');
        const dotCount = 10;
        const dots = [];

        for (let i = 0; i < dotCount; i++) {
            const dot = document.createElement('div');
            dot.className = 'energy-dot';
            hud.appendChild(dot);
            dots.push(dot);
        }

        function updateHUD() {
            const energyPerDot = player.maxEnergy / dotCount;
            dots.forEach((dot, i) => {
                if (player.energy >= (i + 1) * energyPerDot) {
                    dot.classList.remove('depleted');
                } else {
                    dot.classList.add('depleted');
                }
            });
        }

        // --- Main Loop ---
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();
            let delta = (time - lastTime) / 1000;
            lastTime = time;

            if (delta > 0.1) delta = 0.1; // Cap delta to avoid huge jumps

            // --- Arrow Key Look ---
            if (keys['ArrowLeft']) player.lookRotation.y += arrowLookSpeed * delta;
            if (keys['ArrowRight']) player.lookRotation.y -= arrowLookSpeed * delta;
            if (keys['ArrowUp']) player.lookRotation.x += arrowLookSpeed * delta;
            if (keys['ArrowDown']) player.lookRotation.x -= arrowLookSpeed * delta;
            player.lookRotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.lookRotation.x));

            // --- Movement Physics ---
            const moveDir = new THREE.Vector3(0, 0, 0);
            if (keys['KeyW']) moveDir.z -= 1;
            if (keys['KeyS']) moveDir.z += 1;
            if (keys['KeyA']) moveDir.x -= 1;
            if (keys['KeyD']) moveDir.x += 1;
            moveDir.normalize();

            // Rotate moveDir to align with body orientation and yaw
            const yawQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), player.lookRotation.y);
            const combinedMoveQuaternion = new THREE.Quaternion().copy(player.bodyQuaternion).multiply(yawQuaternion);
            moveDir.applyQuaternion(combinedMoveQuaternion);

            // Apply movement
            player.position.addScaledVector(moveDir, moveSpeed * delta);

            // Apply gravity
            const downVector = new THREE.Vector3(0, -1, 0).applyQuaternion(player.bodyQuaternion);
            if (!player.isGrounded) {
                player.velocity.addScaledVector(downVector, gravityForce * delta);
            } else {
                player.velocity.set(0, 0, 0);
            }
            player.position.addScaledVector(player.velocity, delta);

            // --- Collision Detection (Room bounds) ---
            const halfRoom = roomSize / 2;
            const margin = 0.5;
            player.isGrounded = false;

            // Check bottom collision relative to body orientation
            const localPos = player.position.clone().applyQuaternion(player.bodyQuaternion.clone().invert());
            if (localPos.y <= -halfRoom + margin) {
                localPos.y = -halfRoom + margin;
                player.position.copy(localPos.applyQuaternion(player.bodyQuaternion));
                player.isGrounded = true;
            }
            // Ceiling
            if (localPos.y >= halfRoom - margin) {
                localPos.y = halfRoom - margin;
                player.position.copy(localPos.applyQuaternion(player.bodyQuaternion));
            }
            // Walls
            if (localPos.x <= -halfRoom + margin) localPos.x = -halfRoom + margin;
            if (localPos.x >= halfRoom - margin) localPos.x = halfRoom - margin;
            if (localPos.z <= -halfRoom + margin) localPos.z = -halfRoom + margin;
            if (localPos.z >= halfRoom - margin) localPos.z = halfRoom - margin;
            player.position.copy(localPos.applyQuaternion(player.bodyQuaternion));

            // --- Camera Smoothing ---
            if (player.isLeaping) {
                const elapsed = (time - player.leapStartTime) / 1000;
                const t = Math.min(elapsed / player.leapDuration, 1);

                // Slerp from start to target
                visualBodyQuaternion.copy(player.leapStartQuaternion).slerp(player.leapTargetQuaternion, t);

                if (t >= 1) {
                    player.isLeaping = false;
                }
            } else {
                visualBodyQuaternion.copy(player.bodyQuaternion);
            }

            // Update camera orientation
            const lookQuaternion = new THREE.Quaternion().setFromEuler(player.lookRotation);
            camera.quaternion.copy(visualBodyQuaternion).multiply(lookQuaternion);

            // Update camera position to follow player position (accounting for eye level)
            const upOffset = new THREE.Vector3(0, player.height, 0).applyQuaternion(visualBodyQuaternion);
            camera.position.copy(player.position).add(upOffset);

            // --- Energy Regeneration ---
            if (player.energy < player.maxEnergy) {
                player.energy = Math.min(player.maxEnergy, player.energy + energyRegenRate * delta);
            }
            updateHUD();

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
